name: Actualizar precios

# Objetivo: correr dos veces por dia habil, en HORA DE NUEVA YORK:
#   12:00 PM NY -> media sesion, con la hora 11:00-12:00 ya cerrada
#   11:30 PM NY -> bien pasado el cierre, con el dia ya consolidado
#
# El cron de GitHub solo entiende UTC y no ajusta por horario de verano, asi que
# se programan las DOS variantes (EDT = UTC-4, EST = UTC-5) y el primer paso
# descarta la que no corresponda segun la fecha. De lo contrario el horario se
# correria una hora dos veces al año.
on:
  schedule:
    - cron: "0 16 * * 1-5"    # 12:00 NY en horario de verano (EDT)
    - cron: "0 17 * * 1-5"    # 12:00 NY en horario de invierno (EST)
    - cron: "30 3 * * 2-6"    # 23:30 NY (EDT) -> cae al dia siguiente en UTC
    - cron: "30 4 * * 2-6"    # 23:30 NY (EST) -> cae al dia siguiente en UTC
  workflow_dispatch:          # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Verificar si esta corrida corresponde
        id: guard
        run: |
          NY_ZONA=$(TZ=America/New_York date +%Z)      # EDT (verano) o EST (invierno)
          CRON="${{ github.event.schedule }}"
          echo "Hora en Nueva York: $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')"
          echo "Cron que disparo:   '${CRON:-(ninguno: ejecucion manual)}'"

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "-> Ejecucion manual: se corre igual."
            echo "correr=si" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Cada horario tiene dos crons: uno para cuando NY esta en EDT y otro
          # para EST. Se decide mirando CUAL cron disparo, no la hora actual:
          # GitHub puede atrasar los cron varias horas cuando hay carga, y
          # comparar contra el reloj hacia que se descartara la corrida entera.
          case "$CRON" in
            "0 16 * * 1-5"|"30 3 * * 2-6") ESPERADA="EDT" ;;
            "0 17 * * 1-5"|"30 4 * * 2-6") ESPERADA="EST" ;;
            *) ESPERADA="$NY_ZONA" ;;                  # cron desconocido: no bloquear
          esac

          if [ "$NY_ZONA" = "$ESPERADA" ]; then
            echo "-> Nueva York esta en $NY_ZONA y este cron es la variante correcta: se actualiza."
            echo "correr=si" >> "$GITHUB_OUTPUT"
          else
            echo "-> Nueva York esta en $NY_ZONA y este cron es la variante $ESPERADA: se omite."
            echo "correr=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar el repositorio
        if: steps.guard.outputs.correr == 'si'
        uses: actions/checkout@v4

      - name: Preparar Python
        if: steps.guard.outputs.correr == 'si'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        if: steps.guard.outputs.correr == 'si'
        run: pip install requests pandas

      - name: Actualizar precios desde Yahoo
        if: steps.guard.outputs.correr == 'si'
        run: python scripts/refresh_prices.py

      - name: Publicar los datos nuevos
        if: steps.guard.outputs.correr == 'si'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Sin cambios en los datos (probablemente feriado o mercado cerrado)."
            exit 0
          fi
          git add data/precios data/precios_semanal data/_ultima_actualizacion.json
          git commit -m "Actualizacion automatica de precios ($(TZ=America/New_York date '+%Y-%m-%d %H:%M NY'))"
          git push
          echo "Datos publicados. Streamlit Cloud va a redeployar solo en 1-2 minutos."
