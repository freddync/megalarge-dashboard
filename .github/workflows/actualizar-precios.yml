name: Actualizar precios

# Objetivo: actualizar los precios CADA HORA durante el dia de mercado en Nueva
# York (ventana 9:00 a 20:00 NY, de lunes a viernes), y no hacer nada de noche.
#
# El cron de GitHub solo entiende UTC. En vez de enumerar las variantes de
# horario de verano/invierno hora por hora, se dispara cada hora en el rango UTC
# que puede caer dentro de la ventana (13:00-23:00 y 00:00-01:00) y el primer
# paso decide segun la hora LOCAL de Nueva York. Asi el horario de verano se
# ajusta solo.
#
# Importante: el filtro es por VENTANA, no por una hora exacta. GitHub atrasa los
# cron cuando hay carga (se han visto atrasos de horas), y un filtro de igualdad
# descartaria esas corridas por completo.
on:
  schedule:
    - cron: "0 13-23,0-1 * * *"
  workflow_dispatch:          # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

# Con corridas cada hora (cada una tarda ~15 min) conviene que la mas reciente
# reemplace a una anterior que siga colgada, en vez de irse acumulando una cola.
concurrency:
  group: actualizar-precios
  cancel-in-progress: true

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Verificar si estamos en horario de mercado
        id: guard
        env:
          HORA_DESDE: 9      # ventana en hora local de Nueva York
          HORA_HASTA: 20
        run: |
          NY_HORA=$(TZ=America/New_York date +%-H)     # sin cero a la izquierda
          NY_DIA=$(TZ=America/New_York date +%u)       # 1=lunes ... 7=domingo
          echo "Hora en Nueva York: $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z (%a)')"

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "-> Ejecucion manual: se corre igual."
            echo "correr=si" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$NY_DIA" -gt 5 ]; then
            echo "-> Fin de semana en Nueva York: se omite."
            echo "correr=no" >> "$GITHUB_OUTPUT"
          elif [ "$NY_HORA" -ge "$HORA_DESDE" ] && [ "$NY_HORA" -le "$HORA_HASTA" ]; then
            echo "-> Dentro de la ventana ${HORA_DESDE}:00-${HORA_HASTA}:00 NY: se actualiza."
            echo "correr=si" >> "$GITHUB_OUTPUT"
          else
            echo "-> Fuera de la ventana ${HORA_DESDE}:00-${HORA_HASTA}:00 NY (mercado dormido): se omite."
            echo "correr=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar el repositorio
        if: steps.guard.outputs.correr == 'si'
        uses: actions/checkout@v4

      - name: Preparar Python
        if: steps.guard.outputs.correr == 'si'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        if: steps.guard.outputs.correr == 'si'
        run: pip install requests pandas

      - name: Actualizar precios desde Yahoo
        if: steps.guard.outputs.correr == 'si'
        run: python scripts/refresh_prices.py

      - name: Publicar los datos nuevos
        if: steps.guard.outputs.correr == 'si'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Sin cambios en los datos (probablemente feriado o mercado cerrado)."
            exit 0
          fi
          git add data/precios data/precios_semanal data/_ultima_actualizacion.json
          git commit -m "Actualizacion automatica de precios ($(TZ=America/New_York date '+%Y-%m-%d %H:%M NY'))"
          # la foto de Open Interest tambien hace push: si choca, se rebasa y se reintenta
          ok=no
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then ok=si; break; fi
            echo "Push rechazado, reintento $i..."; sleep 20
          done
          [ "$ok" = si ] || exit 1
          echo "Datos publicados. Streamlit Cloud va a redeployar solo en 1-2 minutos."
